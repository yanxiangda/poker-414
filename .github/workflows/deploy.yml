name: 🚀 Deploy to Aliyun

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📦 Checkout code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 🔨 Build frontend
      run: |
        cd frontend
        npm install
        npm run build

    - name: 📦 Package for deployment
      run: |
        tar -czf poker414.tar.gz server/ frontend/dist/

    - name: 📤 Deploy to Aliyun via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.ALIYUN_HOST }}
        username: root
        key: ${{ secrets.ALIYUN_SSH_KEY }}
        port: 22
        script: |
          cd /opt/poker414
          rm -rf server frontend.dist
          echo "Waiting for upload..."
      
    - name: 📥 Upload files via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.ALIYUN_HOST }}
        username: root
        key: ${{ secrets.ALIYUN_SSH_KEY }}
        port: 22
        source: "poker414.tar.gz"
        target: "/opt/poker414"
        strip_components: 0

    - name: 🚀 Start application
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.ALIYUN_HOST }}
        username: root
        key: ${{ secrets.ALIYUN_SSH_KEY }}
        port: 22
        script: |
          cd /opt/poker414
          tar -xzf poker414.tar.gz
          mv server/* .
          rm -rf server
          cd /opt/poker414/server
          npm install --production
          pm2 delete poker414 || true
          pm2 start server.js --name poker414
          pm2 save
          echo "✅ 部署完成！"
